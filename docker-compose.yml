services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-change-me}
      DATABASE_URL: postgresql://league:league@postgres:5432/league
      REDIS_URL: redis://redis:6379/0
      DAY2_DB: /data/day2.sqlite3
      DAY2_INFRA_REQUIRED: "1"
      MEDIA_API: http://media:9997
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes: ["day2-data:/data", "recordings:/recordings:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: {REDIS_URL: "redis://redis:6379/0"}
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: league, POSTGRES_PASSWORD: league, POSTGRES_DB: league}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league -d league"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: bitnamilegacy/minio:2024.9.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: recordings
    volumes: ["minio-data:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
  media:
    build:
      context: ./backend
      dockerfile: Dockerfile.media
    ports: ["1935:1935", "8888:8888", "8889:8889", "8189:8189/udp", "8189:8189/tcp"]
    volumes: ["recordings:/recordings"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9997/v3/paths/list',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  selenium-hub:
    image: selenium/hub:4.24.0
    ports: ["4444:4444", "4442:4442", "4443:4443"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 3s
      retries: 24
  node-chrome-1: &browser
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "2"
      SE_START_VNC: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
  node-chrome-2:
    <<: *browser
  node-firefox:
    <<: *browser
    image: selenium/node-firefox:4.24.0
volumes:
  postgres-data:
  redis-data:
  minio-data:
  recordings:
  day2-data:
